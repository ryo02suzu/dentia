<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dentia — AIカルテ下書き生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#0E9AA7;
    --primary-dark:#0B7C87;
    --primary-deep:#0A5E68;
    --primary-tint:#E8F6F7;
    --primary-soft:#D4ECEE;
    --header-grad-a:#0E9AA7;
    --header-grad-b:#0B7C87;
    --rec:#E0574B;

    --bg:#F2F7F8;
    --surface:#FFFFFF;
    --ink:#16323A;
    --ink-soft:#4A636B;
    --ink-faint:#8AA0A6;
    --line:#E2EAEC;
    --line-soft:#EDF2F3;

    --s-color:#0E9AA7;
    --o-color:#3A7FC4;
    --a-color:#5E6BC4;
    --p-color:#2BA17A;

    --radius:18px;
    --radius-sm:12px;
    --shadow-card:0 1px 2px rgba(16,50,58,.04), 0 8px 28px -12px rgba(16,50,58,.16);
    --shadow-soft:0 1px 2px rgba(16,50,58,.04), 0 2px 10px -6px rgba(16,50,58,.12);
    --fs:16px;
    --pad-scale:1;
    --maxw:1280px;

    font-family:"Zen Kaku Gothic New", system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-size:var(--fs);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .latin{font-family:"Outfit", sans-serif;}

  .page{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,4vw,56px);}

  /* header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 18px;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand .mark{
    width:38px; height:38px; flex:0 0 auto;
    display:grid; place-items:center;
    border-radius:11px;
    background:linear-gradient(150deg, var(--primary), var(--primary-dark));
    box-shadow:0 6px 16px -7px var(--primary-dark);
  }
  .brand .mark svg{width:21px; height:21px; display:block;}
  .brand .word{
    font-family:"Outfit",sans-serif; font-weight:600;
    font-size:25px; letter-spacing:-.02em; color:var(--ink);
    line-height:1;
  }
  .brand .word b{color:var(--primary-dark); font-weight:700;}
  .beta{
    font-family:"Outfit",sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.04em; color:var(--primary-dark);
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    padding:3px 8px; border-radius:999px; margin-left:4px; transform:translateY(-1px);
  }
  .spec{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; color:var(--primary-deep);
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    padding:4px 10px 4px 8px; border-radius:999px; margin-left:6px;
  }
  .spec svg{width:14px;height:14px;}
  .topbar-right{display:flex; align-items:center; gap:18px; color:var(--ink-soft); font-size:13.5px;}
  .topbar-right .who{display:flex; align-items:center; gap:8px;}
  .topbar-right .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(150deg,var(--primary-soft),var(--primary-tint));
    border:1px solid var(--primary-soft);
    display:grid;place-items:center; color:var(--primary-deep); font-weight:700; font-size:12px;
    font-family:"Outfit",sans-serif;
  }

  /* hero */
  .hero{
    padding:6px 0 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .hero h1{
    margin:0 0 7px;
    font-size:clamp(22px,2.5vw,30px); font-weight:900; letter-spacing:-.01em;
    line-height:1.35;
  }
  .hero h1 .accent{color:var(--primary-dark);}
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px; max-width:62ch;}

  /* 2-col layout */
  .work{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
    gap:clamp(18px,2.4vw,30px);
    align-items:start;
    padding-bottom:64px;
  }
  @media (max-width:920px){
    .work{grid-template-columns:1fr;}
  }

  .col-head{display:flex; align-items:center; gap:9px; margin:0 0 13px; padding-left:2px;}
  .col-head .step{
    width:22px;height:22px;border-radius:7px;
    background:var(--primary); color:#fff;
    font-family:"Outfit",sans-serif; font-weight:600; font-size:12px;
    display:grid;place-items:center;
  }
  .col-head h2{margin:0; font-size:15px; font-weight:700; letter-spacing:.01em;}
  .col-head .hint{margin-left:auto; color:var(--ink-faint); font-size:12.5px;}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
  }

  /* input tabs */
  .tabs{
    display:flex; gap:6px; padding:7px 8px 0;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,#FBFDFD,#fff);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .tab{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    color:var(--ink-faint); background:transparent; border:none;
    padding:13px 10px 15px; border-radius:11px 11px 0 0;
    border-bottom:2.5px solid transparent; margin-bottom:-1px;
    transition:color .16s, background .16s, border-color .16s;
  }
  .tab svg{width:16px;height:16px;}
  .tab:hover{color:var(--primary-dark); background:var(--primary-tint);}
  .tab.on{color:var(--primary-deep); border-bottom-color:var(--primary);}
  .tab .rdot{width:7px;height:7px;border-radius:50%;background:var(--rec);
    box-shadow:0 0 0 3px rgba(224,87,75,.18); animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.45;}}

  /* input panel */
  .in-body{padding:calc(22px*var(--pad-scale));}
  .field-label{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:700; color:var(--ink);
    margin:0 0 9px;
  }
  .field-label .req{
    font-size:10.5px; font-weight:600; color:var(--primary-dark);
    background:var(--primary-tint); padding:2px 7px; border-radius:999px; letter-spacing:.02em;
  }
  .field-label .opt{
    font-size:10.5px; font-weight:500; color:var(--ink-faint);
    background:var(--line-soft); padding:2px 7px; border-radius:999px;
  }
  textarea.ta{
    width:100%; resize:vertical;
    border:1.5px solid var(--line); border-radius:var(--radius-sm);
    background:#FBFDFD;
    padding:15px 16px; font-family:inherit; font-size:14.5px; line-height:1.8; color:var(--ink);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  textarea.ta::placeholder{color:#A9BEC4;}
  textarea.ta:focus{
    outline:none; border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-tint); background:#fff;
  }
  #convo{min-height:248px;}
  #memo{min-height:78px;}
  .stack{margin-top:20px;}

  /* record UI */
  .rec-wrap{
    min-height:248px; border:1.5px dashed var(--primary-soft); border-radius:var(--radius-sm);
    background:linear-gradient(180deg,#FBFEFE,#F3FAFB);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:16px;
  }
  .mic-btn{
    width:96px;height:96px;border-radius:50%; cursor:pointer; border:none;
    display:grid;place-items:center; position:relative;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    box-shadow:0 14px 30px -12px var(--primary-dark);
    transition:transform .12s, box-shadow .2s;
  }
  .mic-btn:hover{transform:translateY(-2px); box-shadow:0 18px 36px -12px var(--primary-dark);}
  .mic-btn:active{transform:translateY(0);}
  .mic-btn svg{width:38px;height:38px;color:#fff;}
  .mic-btn.rec{background:linear-gradient(150deg,#EC6357,var(--rec));}
  .mic-btn.rec::before{content:""; position:absolute; inset:-8px; border-radius:50%;
    border:2px solid var(--rec); opacity:.45; animation:ring 1.4s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.9);opacity:.5;}100%{transform:scale(1.25);opacity:0;}}
  .mic-stop{width:26px;height:26px;border-radius:7px;background:#fff;}
  .rec-hint{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .rec-sub{font-size:12.5px;color:var(--ink-faint); margin-top:-10px;}
  .rec-live{display:flex;flex-direction:column;align-items:center;gap:13px;}
  .rec-time{font-family:"Outfit",sans-serif; font-size:30px; font-weight:600;
    letter-spacing:.02em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .rec-time .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;
    background:var(--rec); margin-right:9px; vertical-align:middle;
    box-shadow:0 0 0 4px rgba(224,87,75,.16); animation:pulse 1.1s ease-in-out infinite;}
  .wave{display:flex;align-items:center;gap:3px;height:42px;}
  .wave i{width:3.5px;border-radius:99px;background:var(--primary);
    animation:wv 1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:8px;}50%{height:var(--h,28px);}}
  .transcribe{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .transcribe .spinner{width:38px;height:38px;border-width:3px;}
  .transcribe .ttxt{font-size:13.5px;font-weight:700;color:var(--ink-soft);}

  /* template chips */
  .tmpl-row{margin-top:20px;}
  .tmpl-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--ink); margin-bottom:9px;}
  .tmpl-label svg{width:15px;height:15px;color:var(--primary-dark);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:inherit; cursor:pointer; font-size:13px; font-weight:700;
    color:var(--ink-soft); background:#fff; border:1.5px solid var(--line);
    padding:9px 14px; border-radius:999px;
    display:inline-flex; align-items:center; gap:6px;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--primary-soft); color:var(--primary-dark); background:var(--primary-tint);}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff;
    box-shadow:0 6px 14px -7px var(--primary-dark);}
  .chip .tag{font-family:"Outfit",sans-serif; font-size:10.5px; opacity:.7; font-weight:600;}

  .meta-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px; color:var(--ink-faint); font-size:12px;
  }
  .meta-row .priv{display:flex;align-items:center;gap:6px;}
  .meta-row .priv svg{width:13px;height:13px;}

  .gen-row{margin-top:22px; display:flex; gap:12px; align-items:center;}
  .btn{
    font-family:inherit; cursor:pointer; border:none;
    border-radius:12px; font-weight:700; letter-spacing:.01em;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .12s, box-shadow .18s, background .18s, color .18s, border-color .18s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    flex:1;
    background:linear-gradient(150deg, var(--primary), var(--primary-dark));
    color:#fff; padding:15px 20px; font-size:15.5px;
    box-shadow:0 10px 22px -10px var(--primary-dark);
  }
  .btn-primary:hover{box-shadow:0 13px 26px -10px var(--primary-dark); filter:brightness(1.03);}
  .btn-primary svg{width:18px;height:18px;}
  .btn-primary:disabled{cursor:default; filter:grayscale(.25) brightness(1); opacity:.62; box-shadow:none;}
  .btn-ghost{
    background:#fff; color:var(--ink-soft); border:1.5px solid var(--line);
    padding:13px 16px; font-size:13.5px;
  }
  .btn-ghost:hover{border-color:var(--primary-soft); color:var(--primary-dark); background:var(--primary-tint);}
  .btn-ghost svg{width:15px;height:15px;}
  .btn-emr{
    background:linear-gradient(150deg,var(--primary),var(--primary-dark)); color:#fff;
    padding:13px 16px; font-size:13.5px; box-shadow:0 8px 18px -10px var(--primary-dark);
  }
  .btn-emr:hover{filter:brightness(1.04); box-shadow:0 11px 22px -10px var(--primary-dark);}
  .btn-emr svg{width:15px;height:15px;}
  .btn-emr:disabled,.btn-ghost:disabled{opacity:.5; cursor:default; box-shadow:none;}

  /* result panel */
  .res-head{
    display:flex; align-items:center; gap:12px;
    padding:16px 20px; border-bottom:1px solid var(--line-soft);
  }
  .res-head .title{display:flex;align-items:center;gap:9px; font-weight:700; font-size:14.5px;}
  .res-head .title .dot{width:8px;height:8px;border-radius:50%; background:var(--ink-faint);}
  .res-head .title .dot.live{background:var(--p-color); box-shadow:0 0 0 4px rgba(43,161,122,.16);}
  .time-badge{
    display:inline-flex; align-items:center; gap:6px; margin-left:4px;
    font-family:"Outfit",sans-serif; font-size:12px; font-weight:600;
    color:var(--p-color); background:rgba(43,161,122,.1);
    border:1px solid rgba(43,161,122,.22); padding:3px 9px 3px 7px; border-radius:999px;
  }
  .time-badge svg{width:13px;height:13px;}
  .time-badge b{font-weight:700;}
  .res-actions{margin-left:auto; display:flex; gap:9px;}
  .res-body{padding:calc(20px*var(--pad-scale)); min-height:520px;}

  /* empty state */
  .empty{
    height:480px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-faint); gap:16px; padding:20px;
  }
  .empty .glyph{
    width:74px;height:74px;border-radius:20px;
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    display:grid;place-items:center; color:var(--primary);
  }
  .empty .glyph svg{width:34px;height:34px;}
  .empty h3{margin:0; font-size:16px; color:var(--ink-soft); font-weight:700;}
  .empty p{margin:0; font-size:13.5px; max-width:34ch; line-height:1.7;}

  /* loading */
  .loading{
    height:480px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; text-align:center;
  }
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:3.5px solid var(--primary-tint);
    border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading .ltxt{font-size:14.5px; color:var(--ink-soft); font-weight:600;}
  .loading .lsub{font-size:12.5px; color:var(--ink-faint); margin-top:-12px;}
  .lbar{width:200px;height:5px;border-radius:99px;background:var(--line-soft); overflow:hidden;}
  .lbar > i{display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-40%;}100%{margin-left:100%;}}

  /* SOAP blocks */
  .soap{display:flex; flex-direction:column; gap:14px;}
  .block{
    border:1px solid var(--line); border-radius:14px;
    padding:15px 17px 16px; background:#fff;
    opacity:0; transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease, border-color .3s;
  }
  .block.show{opacity:1; transform:none;}
  .block.active{border-color:var(--blk); box-shadow:0 0 0 3px var(--blk-tint);}
  .block-head{display:flex; align-items:center; gap:11px; margin-bottom:9px;}
  .badge{
    width:34px;height:34px;flex:0 0 auto; border-radius:10px;
    display:grid;place-items:center; color:#fff; font-weight:700; font-size:16px;
    font-family:"Outfit",sans-serif;
    background:var(--blk); box-shadow:0 5px 12px -5px var(--blk);
  }
  .block-head .labels{display:flex; flex-direction:column; line-height:1.25;}
  .block-head .en{font-family:"Outfit",sans-serif; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--blk-deep);}
  .block-head .jp{font-size:14px; font-weight:700; color:var(--ink);}
  .block-body{font-size:14.5px; line-height:1.85; color:var(--ink); white-space:pre-wrap;}
  .caret{display:inline-block; width:2px; height:1.05em; background:var(--blk); vertical-align:-2px; margin-left:1px; animation:blink .9s steps(1) infinite; border-radius:2px;}
  @keyframes blink{50%{opacity:0;}}

  .res-foot{
    display:flex; align-items:center; gap:8px;
    padding:13px 20px; border-top:1px solid var(--line-soft);
    color:var(--ink-faint); font-size:12px;
  }
  .res-foot svg{width:14px;height:14px;}
  .res-foot .ai-tag{
    margin-left:auto; font-family:"Outfit",sans-serif; font-weight:500; letter-spacing:.02em;
    color:var(--ink-faint);
  }

  /* action bar */
  .action-bar{
    display:flex; gap:11px; padding:14px 20px 18px;
  }
  .action-bar .btn-emr{flex:1.3;}
  .action-bar .btn-ghost{flex:1;}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:0 14px 34px -10px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:9px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:90;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px; color:#7DE0C0;}

  @media (prefers-reduced-motion: reduce){
    .block{transition:opacity .2s;}
    .spinner{animation-duration:1.2s;}
    .caret{animation:none;}
  }

  /* ── ログイン/記録（追加・既存トークンに合わせた新規クラスのみ） ── */
  .splash{min-height:100vh; display:grid; place-items:center; background:var(--bg);}
  .auth{min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg);}
  .auth-card{width:100%; max-width:420px;}
  .auth-head{display:flex; flex-direction:column; align-items:center; gap:9px; margin-bottom:6px; text-align:center;}
  .auth-head .mark{width:44px; height:44px;}
  .auth-head .word{font-family:"Outfit",sans-serif; font-weight:600; font-size:27px; letter-spacing:-.02em; color:var(--ink); line-height:1;}
  .auth-head .word b{color:var(--primary-dark); font-weight:700;}
  .auth-head p{margin:2px 0 0; color:var(--ink-soft); font-size:13px;}
  .auth .tabs{margin-bottom:18px; border-radius:12px;}
  .auth input{
    width:100%; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    background:#FBFDFD; padding:13px 14px; font-family:inherit; font-size:14.5px; color:var(--ink);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .auth input::placeholder{color:#A9BEC4;}
  .auth input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-tint); background:#fff;}
  .auth .field-label{margin-top:14px;}
  .auth-err{margin-top:13px; color:#B5392B; background:#FDECEA; border:1px solid #F5C6C0; border-radius:10px; padding:9px 12px; font-size:13px;}
  .auth-agree{display:flex; align-items:flex-start; gap:9px; margin-top:14px;
    font-size:12.5px; line-height:1.6; color:var(--ink-soft); cursor:pointer;}
  .auth-agree input{width:auto; margin-top:3px; accent-color:var(--primary);}
  .auth-agree a{color:var(--primary-dark); font-weight:700;}
  .auth-msg{margin-top:13px; color:var(--primary-deep); background:var(--primary-tint); border:1px solid var(--primary-soft); border-radius:10px; padding:9px 12px; font-size:13px;}

  .topbar-right .btn-ghost{padding:8px 12px; font-size:12.5px;}

  /* 保存カルテ オーバーレイ */
  .sheet{position:fixed; inset:0; z-index:80; background:var(--bg); overflow-y:auto;}
  .sheet-head{position:sticky; top:0; z-index:1; background:rgba(242,247,248,.92);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .sheet-head .bar{display:flex; align-items:center; gap:12px; padding:15px 0;}
  .sheet-head h2{margin:0; font-size:16px; font-weight:700; letter-spacing:.01em;}
  .sheet-head .sp{margin-left:auto;}
  .sheet-body{padding-top:24px; padding-bottom:56px;}
  .rec-list{display:flex; flex-direction:column; gap:10px;}
  .rec-item{display:flex; align-items:center; gap:14px; padding:14px 16px;
    border:1px solid var(--line); border-radius:14px; background:var(--surface); cursor:pointer;
    transition:border-color .15s, box-shadow .15s;}
  .rec-item:hover{border-color:var(--primary-soft); box-shadow:var(--shadow-soft);}
  .rec-item .ri-main{min-width:0; flex:1;}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">

        setTyped(prev=>{ const n=[...prev]; n[i]=full.slice(0,c); return n; });

      if(!res.ok) throw new Error(data.error || `文字起こしに失敗しました（HTTP ${res.status}）`);
      const text = (data.text||"").trim();
      if(!text){ setRecState("error"); setRecErr("音声から文字を認識できませんでした。はっきり話して、もう一度お試しください。"); return; }
      setRecState("idle");
      setConvo(text);          // 文字起こし結果を手入力欄へ（確認・修正できる保険）
      setInputMode("paste");
      genRef.current(text);    // 続けて自動でSOAP生成
    }catch(err){
      setRecState("error");
      setRecErr(err.message || "文字起こしに失敗しました。通信状況をご確認ください。");
    }
  };

  const startRecording = async ()=>{
    setRecErr("");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==="undefined"){
      setRecState("error"); setRecErr("このブラウザは録音に対応していません。手入力をご利用ください。"); return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      streamRef.current = stream;
      chunks.current = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = (e)=>{ if(e.data && e.data.size>0) chunks.current.push(e.data); };
      mr.onstop = ()=>{ handleTranscribe(); };
      mediaRec.current = mr;
      mr.start();
      setRecState("recording"); setRecSec(0);
      recTimer.current = setInterval(()=>setRecSec(s=>s+1), 1000);
    }catch(err){
      stopStream();
      setRecState("error");
      setRecErr("マイクを使用できませんでした。ブラウザのマイク許可（設定）をご確認ください。");
    }
  };

  const stopRecording = ()=>{
    if(recTimer.current){ clearInterval(recTimer.current); recTimer.current=null; }
    if(mediaRec.current && mediaRec.current.state!=="inactive"){ mediaRec.current.stop(); }
  };

  const toggleRecord = ()=>{
    if(recState==="recording") stopRecording();
    else startRecording();
  };

  const copyAll = ()=>{
    const soap = resultRef.current;
    const txt = BLOCKS.map((b,i)=>`【${b.key}】${b.jp}\n${soap[i]||""}`).join("\n\n");
    if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
    showToast("SOAPカルテをコピーしました");
  };

  const pasteEMR = ()=> showToast("レセコンへ転記しました（デモ）");

  const canGen = convo.trim().length>0 && phase!=="loading" && recState!=="recording" && recState!=="transcribing";
  const live = phase==="done";
  const curTmpl = TEMPLATES.find(x=>x.id===tmpl);

        <div className="brand">
          <span className="mark"><Ico.tooth stroke="#fff"/></span>
          <span className="word">dent<b>ia</b></span>
          <span className="beta latin">BETA</span>
          <span className="spec"><Ico.tooth stroke="currentColor"/> 歯科専用AIカルテ</span>
        </div>
        <div className="topbar-right">
          <span className="who">
            <span className="avatar">{authEnabled ? session.user.email.slice(0,2).toUpperCase() : "DC"}</span>
            <span>{authEnabled ? session.user.email : "田中デンタルクリニック"}</span>
          </span>
          {authEnabled && (
            <React.Fragment>
              <button className="btn btn-ghost" onClick={()=>setShowRecords(true)}>
                <Ico.doc stroke="currentColor"/> 保存カルテ
              </button>
              <button className="btn btn-ghost" onClick={()=>setShowFeedback(true)}>ご意見</button>
              <button className="btn btn-ghost" onClick={()=>sb.auth.signOut()}>ログアウト</button>
            </React.Fragment>
          )}
        </div>
      </header>

      <section className="hero">
        <h1>カルテ入力の時間を、<span className="accent">患者と向き合う時間</span>に。</h1>
        <p>診療の会話を貼り付け、または録音するだけ。歯科に特化したAIが、歯式・歯周検査・処置内容を反映したSOAP形式のカルテ下書きを生成します。</p>
      </section>

      <div className="work">
        {/* LEFT — input */}
        <section>
          <div className="col-head">
            <span className="step">1</span>
            <h2>入力</h2>
            <span className="hint">貼り付け / 録音 → 生成</span>
          </div>
          <div className="panel">
            <div className="tabs">
              <button className={"tab"+(inputMode==="record"?" on":"")} onClick={()=>setInputMode("record")}>
                {recState==="recording" ? <span className="rdot"></span> : <Ico.mic stroke="currentColor"/>}
                録音して入力
              </button>
              <button className={"tab"+(inputMode==="paste"?" on":"")} onClick={()=>setInputMode("paste")}>
                <Ico.doc stroke="currentColor"/> 手入力
              </button>
            </div>

            <div className="in-body">
              {inputMode==="paste" && (
                <React.Fragment>
                  <label className="field-label" htmlFor="convo">
                    診療の会話を貼り付け <span className="req">必須</span>
                  </label>
                  <textarea id="convo" className="ta" value={convo}
                    onChange={e=>setConvo(e.target.value)}
                    placeholder={DATA.first.convo}/>
                  <div className="meta-row">
                    <span className="priv"><Ico.lock stroke="currentColor"/> 入力内容は診療目的にのみ利用されます</span>
                    <span>{convo.length} 文字</span>

              {inputMode==="record" && (

                    <React.Fragment>
                      <button className="mic-btn" onClick={toggleRecord}><Ico.mic stroke="#fff"/></button>
                      <div className="rec-hint">タップして録音を開始</div>

                      <div className="rec-time"><span className="live-dot"></span>{fmtTime(recSec)}</div>

                <textarea id="memo" className="ta" value={memo}

              <div className="tmpl-row">

          <div className="panel">
            <div className="res-head">
              <span className="title">
                <span className={"dot"+(live?" live":"")}></span>

function translateAuthError(e){
  const m = (e && e.message) || "";
  if(/Invalid login credentials/i.test(m)) return "メールアドレスまたはパスワードが正しくありません。";
  if(/already registered|already exists/i.test(m)) return "このメールアドレスは既に登録されています。ログインしてください。";
  if(/Password should be at least/i.test(m)) return "パスワードは6文字以上にしてください。";
  if(/Email not confirmed/i.test(m)) return "メール確認が完了していません。確認メールのリンクを承認してください。";
  if(/rate limit|too many/i.test(m)) return "試行回数が多すぎます。しばらくしてからお試しください。";
  return m || "認証に失敗しました。";
}

function Splash(){
  return <div className="splash"><div className="spinner"></div></div>;
}

function AuthScreen({ sb, inviteRequired=false }){
  const [mode, setMode] = useState("login"); // login | signup
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [invite, setInvite] = useState("");
  const [agree, setAgree] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");

  const submit = async (e)=>{
    e.preventDefault();
    setErr(""); setMsg(""); setBusy(true);
    try{
      if(mode==="signup"){
        if(!agree) throw new Error("利用規約・プライバシーポリシーへの同意が必要です。");
        if(inviteRequired){
          const r = await fetch("/api/validate-invite", {
            method:"POST", headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({ code: invite }),
          });
          const j = await r.json().catch(()=>({}));
          if(!r.ok || !j.ok) throw new Error(j.error || "招待コードが正しくありません。");
        }
        const { data, error } = await sb.auth.signUp({ email, password: pw });
        if(error) throw error;
        if(!data.session) setMsg("確認メールを送信しました。メール内のリンクを承認してからログインしてください。");
        // セッションが返ればonAuthStateChangeで自動的に本体へ遷移
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password: pw });
        if(error) throw error;
      }
    }catch(e2){
      setErr(translateAuthError(e2));
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="auth">
      <div className="auth-card panel">
        <div className="in-body">
          <div className="auth-head">
            <span className="mark"><Ico.tooth stroke="#fff"/></span>
            <span className="word">dent<b>ia</b></span>
            <p>歯科専用AIカルテ — ログインしてご利用ください</p>
          </div>
          <div className="tabs">
            <button type="button" className={"tab"+(mode==="login"?" on":"")}
              onClick={()=>{setMode("login");setErr("");setMsg("");}}>ログイン</button>
            <button type="button" className={"tab"+(mode==="signup"?" on":"")}
              onClick={()=>{setMode("signup");setErr("");setMsg("");}}>新規登録</button>
          </div>
          <form onSubmit={submit}>
            <label className="field-label" htmlFor="email">メールアドレス</label>
            <input id="email" type="email" autoComplete="email" required
              value={email} onChange={e=>setEmail(e.target.value)} placeholder="dentist@example.com"/>
            <label className="field-label" htmlFor="pw">パスワード</label>
            <input id="pw" type="password" required minLength={6}
              autoComplete={mode==="signup"?"new-password":"current-password"}
              value={pw} onChange={e=>setPw(e.target.value)} placeholder="6文字以上"/>
            {mode==="signup" && inviteRequired && (
              <React.Fragment>
                <label className="field-label" htmlFor="invite">招待コード <span className="req">ベータ参加院向け</span></label>
                <input id="invite" type="text" required autoComplete="off"
                  value={invite} onChange={e=>setInvite(e.target.value)} placeholder="お渡ししたコードを入力"/>
              </React.Fragment>
            )}
            {mode==="signup" && (
              <label className="auth-agree">
                <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)}/>
                <span>
                  <a href="/terms" target="_blank" rel="noopener">利用規約</a> と
                  <a href="/privacy" target="_blank" rel="noopener"> プライバシーポリシー</a>
                  （診療会話を海外のAIサービスへ送信して処理することを含む）に同意します
                </span>
              </label>
            )}
            {err && <div className="auth-err">{err}</div>}
            {msg && <div className="auth-msg">{msg}</div>}
            <div className="gen-row">
              <button type="submit" className="btn btn-primary"
                disabled={busy || !email || pw.length<6 || (mode==="signup" && (!agree || (inviteRequired && !invite.trim())))}>
                {busy ? "処理中…" : (mode==="signup" ? "新規登録してはじめる" : "ログイン")}
              </button>
            </div>
          </form>
          <div className="res-foot" style={{padding:"15px 0 2px", borderTop:"none"}}>
            <Ico.lock stroke="currentColor"/>
            <span>診療情報を扱うため、アカウントごとにデータを保護しています。</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function RecordsView({ sb, onClose }){
  const [rows, setRows] = useState(null); // null=loading
  const [err, setErr] = useState("");
  const [sel, setSel] = useState(null);

  useEffect(()=>{
    let alive = true;
    sb.from("records").select("*").order("created_at",{ascending:false}).limit(200)
      .then(({data,error})=>{
        if(!alive) return;
        if(error){ setErr(error.message); setRows([]); }
        else setRows(data||[]);
      });
    return ()=>{ alive=false; };
  },[sb]);

  const fmtDate = (s)=>{
    try{ return new Date(s).toLocaleString("ja-JP",
      {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
    catch(_){ return s; }
  };
  const tmplLabel = (id)=>{ const m = TEMPLATES.find(x=>x.id===id); return m?m.label:(id||"—"); };

  const del = async (id)=>{
    const { error } = await sb.from("records").delete().eq("id", id);
    if(!error){ setRows(rs=>(rs||[]).filter(r=>r.id!==id)); setSel(null); }
  };

  return (
    <div className="sheet">
      <div className="sheet-head">
        <div className="page bar">
          {sel
            ? <button className="btn btn-ghost" onClick={()=>setSel(null)}>← 一覧へ</button>
            : <h2>保存したカルテ</h2>}
          <button className="btn btn-ghost sp" onClick={onClose}>閉じる</button>
        </div>
      </div>
      <div className="page sheet-body">
        {rows===null && (
          <div className="loading"><div className="spinner"></div><div className="ltxt">読み込み中…</div></div>
        )}
        {rows && err && <div className="rec-empty">読み込みに失敗しました：{err}</div>}
        {rows && !err && rows.length===0 && (
          <div className="rec-empty">保存されたカルテはまだありません。<br/>録音または手入力でSOAPを生成すると、ここに自動で保存されます。</div>
        )}

        {rows && !err && !sel && rows.length>0 && (
          <div className="rec-list">
            {rows.map(r=>(
              <div key={r.id} className="rec-item" onClick={()=>setSel(r)}>
                <div className="ri-main">
                  <div className="ri-tmpl">{tmplLabel(r.template)}</div>
                  <div className="ri-snip">{(r.s||r.transcript||"").slice(0,80)}</div>
                </div>
                <div className="ri-date">{fmtDate(r.created_at)}</div>
              </div>
            ))}
          </div>
        )}

        {sel && (
          <div>
            <div className="col-head" style={{marginBottom:14}}>
              <h2>{tmplLabel(sel.template)}・SOAPカルテ</h2>
              <span className="hint">{fmtDate(sel.created_at)}</span>
            </div>
            <div className="soap">
              {BLOCKS.map(b=>{
                const val = {S:sel.s,O:sel.o,A:sel.a,P:sel.p}[b.key] || "";
                return (
                  <div key={b.key} className="block show"
                    style={{"--blk":b.color,"--blk-deep":b.deep,"--blk-tint":b.tint}}>
                    <div className="block-head">
                      <span className="badge">{b.key}</span>
                      <span className="labels">
                        <span className="en">{b.en}</span>
                        <span className="jp">{b.jp}</span>
                      </span>
                    </div>
                    <div className="block-body">{val}</div>
                  </div>
                );
              })}
            </div>
            <div className="res-foot">
              <Ico.check stroke="var(--p-color)"/>
              <span>内容をご確認のうえ、加筆・修正してご利用ください。</span>
              <button className="btn btn-ghost" style={{marginLeft:"auto"}} onClick={()=>del(sel.id)}>削除</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function FeedbackModal({ sb, onClose, showToast }){
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async ()=>{
    if(!msg.trim()) return;
    setBusy(true);
    const { error } = await sb.from("feedback").insert({ message: msg.trim(), page: "app" });
    setBusy(false);
    if(error){ console.error("feedback error:", error); showToast("送信に失敗しました。お手数ですが時間をおいてお試しください。"); }
    else { showToast("ご意見ありがとうございます"); onClose(); }
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal panel" onClick={e=>e.stopPropagation()}>
        <div className="in-body">
          <div className="field-label">ご意見・ご要望 <span className="opt">ベータ改善に活用します</span></div>
          <textarea className="ta" style={{minHeight:130}} value={msg}
            onChange={e=>setMsg(e.target.value)}
            placeholder="使ってみて気づいた点・欲しい機能・歯科用語の誤変換など、何でもお書きください。"/>
          <div className="gen-row" style={{marginTop:14}}>
            <button className="btn btn-primary" onClick={submit} disabled={busy || !msg.trim()}>
              {busy ? "送信中…" : "送信"}
            </button>
            <button className="btn btn-ghost" onClick={onClose}>閉じる</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function QRModal({ soap, onClose }){
  const [imgs, setImgs] = useState(null); // [{label, src}] / null=生成中
  const [err, setErr] = useState("");
  const [split, setSplit] = useState(false); // 長文でブロック分割したか

  useEffect(()=>{
    let alive = true;
    const Q = window.QRCode;
    if(!Q){ setErr("QRコードの生成ライブラリを読み込めませんでした。「コピー」をご利用ください。"); return; }
    const opt = { errorCorrectionLevel:"L", margin:1, width:320, color:{ dark:"#16323A", light:"#ffffff" } };
    const fullText = BLOCKS.map((b,i)=>`【${b.key}】${b.jp}\n${soap[i]||""}`).join("\n\n");
    Q.toDataURL(fullText, opt).then(src=>{
      if(alive) setImgs([{ label:"SOAP全文", src }]);
    }).catch(()=>{
      // 1枚に収まらない → S/O/A/P ごとに分割
      if(alive) setSplit(true);
      Promise.all(BLOCKS.map((b,i)=>
        Q.toDataURL(`【${b.key}】${b.jp}\n${soap[i]||""}`, opt)
          .then(src=>({ label:`${b.key}：${b.jp}`, src })).catch(()=>null)
      )).then(arr=>{ if(alive) setImgs((arr||[]).filter(Boolean)); });
    });
    return ()=>{ alive=false; };
  },[]);

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal panel" onClick={e=>e.stopPropagation()}>
        <div className="in-body">
          <div className="field-label">QRで転記 <span className="opt">ネットを介さず端末へ</span></div>
          <p className="qr-note">電子カルテ／レセコン端末のバーコードリーダーで読み取ると、本文を入力欄へ転記できます{split?"（長いため S/O/A/P に分割しています。順に読み取ってください）":""}。</p>
          {err && <div className="auth-err">{err}</div>}
          {!err && imgs===null && <div className="qr-loading"><div className="spinner"></div></div>}
          {!err && imgs && imgs.length===0 && <div className="auth-err">QRコードを生成できませんでした。「コピー」をご利用ください。</div>}
          {!err && imgs && imgs.map((im,i)=>(
            <div className="qr-item" key={i}>
              <div className="qr-label">{im.label}</div>
              <img className="qr-img" src={im.src} alt={"QR: "+im.label}/>
            </div>
          ))}
          <div className="gen-row" style={{marginTop:14}}>
            <button className="btn btn-ghost" onClick={onClose}>閉じる</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Root(){
  const [cfg, setCfg] = useState(null);            // null=未取得
  const [sb, setSb] = useState(null);              // supabaseクライアント or null
  const [session, setSession] = useState(undefined); // undefined=判定中, null=未ログイン, obj=ログイン中
  const [clinicId, setClinicId] = useState(null);  // 所属医院ID（マルチテナント。未マイグレーション時はnull）

  useEffect(()=>{
    let alive = true;
    fetch("/api/config").then(r=>r.json()).then(c=>{
      if(!alive) return;
      c = c || {};
      setCfg(c);
      if(c.supabaseUrl && c.supabaseAnonKey && window.supabase){
        const client = window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
        setSb(client);
        client.auth.getSession().then(({data})=>{ if(alive) setSession(data.session||null); });
        client.auth.onAuthStateChange((_e, s)=>{ if(alive) setSession(s||null); });
      } else {
        setSession(null); // 認証未設定 → ログイン無しの従来モード
      }
    }).catch(()=>{ if(alive){ setCfg({}); setSession(null); } });
    return ()=>{ alive=false; };
  },[]);

  // ログイン後、自分の医院IDを取得（無ければ自動作成）。未マイグレーション環境ではnullのまま＝従来動作。
  useEffect(()=>{
    let alive = true;
    if(sb && session){
      sb.rpc("ensure_clinic").then(({data,error})=>{
        if(alive && !error && data) setClinicId(data);
      }).catch(()=>{});
    } else {
      setClinicId(null);
    }
    return ()=>{ alive=false; };
  },[sb, session]);

  const authEnabled = !!(cfg && cfg.supabaseUrl && cfg.supabaseAnonKey && sb);

  if(cfg===null || session===undefined) return <Splash/>;
  if(authEnabled && !session) return <AuthScreen sb={sb} inviteRequired={!!cfg.inviteRequired}/>;
  return <App sb={authEnabled ? sb : null} session={authEnabled ? session : null} clinicId={authEnabled ? clinicId : null}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
  </script>
</body>
</html>
