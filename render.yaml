# Render Blueprint — dentia
# Render の「New > Blueprint」でこのリポジトリを選ぶと、この設定で
# Node の Web サービスが作成されます。
# ANTHROPIC_API_KEY は sync:false なので、リポジトリには保存されず
# Render のダッシュボードで入力します（秘匿管理）。
services:
  - type: web
    name: dentia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DAILY_API_LIMIT
        value: "200"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
