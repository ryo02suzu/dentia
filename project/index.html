<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dentia — AIカルテ下書き生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* default theme = clear teal; overwritten by JS theme switch */
    --primary:#0E9AA7;
    --primary-dark:#0B7C87;
    --primary-deep:#0A5E68;
    --primary-tint:#E8F6F7;
    --primary-soft:#D4ECEE;
    --header-grad-a:#0E9AA7;
    --header-grad-b:#0B7C87;

    --bg:#F2F7F8;
    --surface:#FFFFFF;
    --ink:#16323A;
    --ink-soft:#4A636B;
    --ink-faint:#8AA0A6;
    --line:#E2EAEC;
    --line-soft:#EDF2F3;

    /* SOAP badge cool family */
    --s-color:#0E9AA7;
    --o-color:#3A7FC4;
    --a-color:#5E6BC4;
    --p-color:#2BA17A;

    --radius:18px;
    --radius-sm:12px;
    --shadow-card:0 1px 2px rgba(16,50,58,.04), 0 8px 28px -12px rgba(16,50,58,.16);
    --shadow-soft:0 1px 2px rgba(16,50,58,.04), 0 2px 10px -6px rgba(16,50,58,.12);
    --fs:16px;
    --pad-scale:1;
    --maxw:1280px;

    font-family:"Zen Kaku Gothic New", system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-size:var(--fs);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .latin{font-family:"Outfit", sans-serif;}

  /* ---------- shell ---------- */
  .page{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,4vw,56px);}

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 18px;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand .mark{
    width:38px; height:38px; flex:0 0 auto;
    display:grid; place-items:center;
    border-radius:11px;
    background:linear-gradient(150deg, var(--primary), var(--primary-dark));
    box-shadow:0 6px 16px -7px var(--primary-dark);
  }
  .brand .mark svg{width:21px; height:21px; display:block;}
  .brand .word{
    font-family:"Outfit",sans-serif; font-weight:600;
    font-size:25px; letter-spacing:-.02em; color:var(--ink);
    line-height:1;
  }
  .brand .word b{color:var(--primary-dark); font-weight:700;}
  .beta{
    font-family:"Outfit",sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.04em; color:var(--primary-dark);
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    padding:3px 8px; border-radius:999px; margin-left:4px; transform:translateY(-1px);
  }
  .spec{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; color:var(--primary-deep);
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    padding:4px 10px 4px 8px; border-radius:999px; margin-left:6px;
  }
  .spec svg{width:14px;height:14px;}
  .topbar-right{display:flex; align-items:center; gap:18px; color:var(--ink-soft); font-size:13.5px;}
  .topbar-right .who{display:flex; align-items:center; gap:8px;}
  .topbar-right .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(150deg,var(--primary-soft),var(--primary-tint));
    border:1px solid var(--primary-soft);
    display:grid;place-items:center; color:var(--primary-deep); font-weight:700; font-size:12px;
    font-family:"Outfit",sans-serif;
  }

  /* ---------- hero strip ---------- */
  .hero{
    padding:6px 0 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .hero h1{
    margin:0 0 7px;
    font-size:clamp(22px,2.5vw,30px); font-weight:900; letter-spacing:-.01em;
    line-height:1.35;
  }
  .hero h1 .accent{color:var(--primary-dark);}
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px; max-width:62ch;}

  /* ---------- 2-col layout ---------- */
  .work{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
    gap:clamp(18px,2.4vw,30px);
    align-items:start;
    padding-bottom:64px;
  }
  @media (max-width:920px){
    .work{grid-template-columns:1fr;}
  }

  .col-head{display:flex; align-items:center; gap:9px; margin:0 0 13px; padding-left:2px;}
  .col-head .step{
    width:22px;height:22px;border-radius:7px;
    background:var(--primary); color:#fff;
    font-family:"Outfit",sans-serif; font-weight:600; font-size:12px;
    display:grid;place-items:center;
  }
  .col-head h2{margin:0; font-size:15px; font-weight:700; letter-spacing:.01em;}
  .col-head .hint{margin-left:auto; color:var(--ink-faint); font-size:12.5px;}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-card);
  }

  /* ---------- input tabs ---------- */
  .tabs{
    display:flex; gap:6px; padding:7px 8px 0;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,#FBFDFD,#fff);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .tab{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    color:var(--ink-faint); background:transparent; border:none;
    padding:13px 10px 15px; border-radius:11px 11px 0 0;
    border-bottom:2.5px solid transparent; margin-bottom:-1px;
    transition:color .16s, background .16s, border-color .16s;
  }
  .tab svg{width:16px;height:16px;}
  .tab:hover{color:var(--primary-dark); background:var(--primary-tint);}
  .tab.on{color:var(--primary-deep); border-bottom-color:var(--primary);}
  .tab .rdot{width:7px;height:7px;border-radius:50%;background:var(--rec);
    box-shadow:0 0 0 3px rgba(224,87,75,.18); animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.45;}}

  /* ---------- input panel ---------- */
  .in-body{padding:calc(22px*var(--pad-scale));}
  .field-label{
    display:flex; align-items:center; gap:7px;
    font-size:13.5px; font-weight:700; color:var(--ink);
    margin:0 0 9px;
  }
  .field-label .req{
    font-size:10.5px; font-weight:600; color:var(--primary-dark);
    background:var(--primary-tint); padding:2px 7px; border-radius:999px; letter-spacing:.02em;
  }
  .field-label .opt{
    font-size:10.5px; font-weight:500; color:var(--ink-faint);
    background:var(--line-soft); padding:2px 7px; border-radius:999px;
  }
  textarea.ta{
    width:100%; resize:vertical;
    border:1.5px solid var(--line); border-radius:var(--radius-sm);
    background:#FBFDFD;
    padding:15px 16px; font-family:inherit; font-size:14.5px; line-height:1.8; color:var(--ink);
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  textarea.ta::placeholder{color:#A9BEC4;}
  textarea.ta:focus{
    outline:none; border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-tint); background:#fff;
  }
  #convo{min-height:248px;}
  #memo{min-height:78px;}
  .stack{margin-top:20px;}

  /* ---------- record UI ---------- */
  .rec-wrap{
    min-height:248px; border:1.5px dashed var(--primary-soft); border-radius:var(--radius-sm);
    background:linear-gradient(180deg,#FBFEFE,#F3FAFB);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:16px;
  }
  .mic-btn{
    width:96px;height:96px;border-radius:50%; cursor:pointer; border:none;
    display:grid;place-items:center; position:relative;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    box-shadow:0 14px 30px -12px var(--primary-dark);
    transition:transform .12s, box-shadow .2s;
  }
  .mic-btn:hover{transform:translateY(-2px); box-shadow:0 18px 36px -12px var(--primary-dark);}
  .mic-btn:active{transform:translateY(0);}
  .mic-btn svg{width:38px;height:38px;color:#fff;}
  .mic-btn.rec{background:linear-gradient(150deg,#EC6357,var(--rec));}
  .mic-btn.rec::before{content:""; position:absolute; inset:-8px; border-radius:50%;
    border:2px solid var(--rec); opacity:.45; animation:ring 1.4s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.9);opacity:.5;}100%{transform:scale(1.25);opacity:0;}}
  .mic-stop{width:26px;height:26px;border-radius:7px;background:#fff;}
  .rec-hint{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .rec-sub{font-size:12.5px;color:var(--ink-faint); margin-top:-10px;}
  .rec-live{display:flex;flex-direction:column;align-items:center;gap:13px;}
  .rec-time{font-family:"Outfit",sans-serif; font-size:30px; font-weight:600;
    letter-spacing:.02em; color:var(--ink); font-variant-numeric:tabular-nums;}
  .rec-time .live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;
    background:var(--rec); margin-right:9px; vertical-align:middle;
    box-shadow:0 0 0 4px rgba(224,87,75,.16); animation:pulse 1.1s ease-in-out infinite;}
  .wave{display:flex;align-items:center;gap:3px;height:42px;}
  .wave i{width:3.5px;border-radius:99px;background:var(--primary);
    animation:wv 1s ease-in-out infinite;}
  @keyframes wv{0%,100%{height:8px;}50%{height:var(--h,28px);}}
  .transcribe{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .transcribe .spinner{width:38px;height:38px;border-width:3px;}
  .transcribe .ttxt{font-size:13.5px;font-weight:700;color:var(--ink-soft);}

  /* ---------- template select ---------- */
  .tmpl-row{margin-top:20px;}
  .tmpl-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--ink); margin-bottom:9px;}
  .tmpl-label svg{width:15px;height:15px;color:var(--primary-dark);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-family:inherit; cursor:pointer; font-size:13px; font-weight:700;
    color:var(--ink-soft); background:#fff; border:1.5px solid var(--line);
    padding:9px 14px; border-radius:999px;
    display:inline-flex; align-items:center; gap:6px;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--primary-soft); color:var(--primary-dark); background:var(--primary-tint);}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff;
    box-shadow:0 6px 14px -7px var(--primary-dark);}
  .chip .tag{font-family:"Outfit",sans-serif; font-size:10.5px; opacity:.7; font-weight:600;}

  .meta-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px; color:var(--ink-faint); font-size:12px;
  }
  .meta-row .priv{display:flex;align-items:center;gap:6px;}
  .meta-row .priv svg{width:13px;height:13px;}

  .gen-row{margin-top:22px; display:flex; gap:12px; align-items:center;}
  .btn{
    font-family:inherit; cursor:pointer; border:none;
    border-radius:12px; font-weight:700; letter-spacing:.01em;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .12s, box-shadow .18s, background .18s, color .18s, border-color .18s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    flex:1;
    background:linear-gradient(150deg, var(--primary), var(--primary-dark));
    color:#fff; padding:15px 20px; font-size:15.5px;
    box-shadow:0 10px 22px -10px var(--primary-dark);
  }
  .btn-primary:hover{box-shadow:0 13px 26px -10px var(--primary-dark); filter:brightness(1.03);}
  .btn-primary svg{width:18px;height:18px;}
  .btn-primary:disabled{cursor:default; filter:grayscale(.25) brightness(1); opacity:.62; box-shadow:none;}
  .btn-ghost{
    background:#fff; color:var(--ink-soft); border:1.5px solid var(--line);
    padding:13px 16px; font-size:13.5px;
  }
  .btn-ghost:hover{border-color:var(--primary-soft); color:var(--primary-dark); background:var(--primary-tint);}
  .btn-ghost svg{width:15px;height:15px;}
  .btn-emr{
    background:linear-gradient(150deg,var(--primary),var(--primary-dark)); color:#fff;
    padding:13px 16px; font-size:13.5px; box-shadow:0 8px 18px -10px var(--primary-dark);
  }
  .btn-emr:hover{filter:brightness(1.04); box-shadow:0 11px 22px -10px var(--primary-dark);}
  .btn-emr svg{width:15px;height:15px;}
  .btn-emr:disabled,.btn-ghost:disabled{opacity:.5; cursor:default; box-shadow:none;}

  /* ---------- result panel ---------- */
  .res-head{
    display:flex; align-items:center; gap:12px;
    padding:16px 20px; border-bottom:1px solid var(--line-soft);
  }
  .res-head .title{display:flex;align-items:center;gap:9px; font-weight:700; font-size:14.5px;}
  .res-head .title .dot{width:8px;height:8px;border-radius:50%; background:var(--ink-faint);}
  .res-head .title .dot.live{background:var(--p-color); box-shadow:0 0 0 4px rgba(43,161,122,.16);}
  .time-badge{
    display:inline-flex; align-items:center; gap:6px; margin-left:4px;
    font-family:"Outfit",sans-serif; font-size:12px; font-weight:600;
    color:var(--p-color); background:rgba(43,161,122,.1);
    border:1px solid rgba(43,161,122,.22); padding:3px 9px 3px 7px; border-radius:999px;
  }
  .time-badge svg{width:13px;height:13px;}
  .time-badge b{font-weight:700;}
  .res-actions{margin-left:auto; display:flex; gap:9px;}
  .res-body{padding:calc(20px*var(--pad-scale)); min-height:520px;}

  /* empty state */
  .empty{
    height:480px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--ink-faint); gap:16px; padding:20px;
  }
  .empty .glyph{
    width:74px;height:74px;border-radius:20px;
    background:var(--primary-tint); border:1px solid var(--primary-soft);
    display:grid;place-items:center; color:var(--primary);
  }
  .empty .glyph svg{width:34px;height:34px;}
  .empty h3{margin:0; font-size:16px; color:var(--ink-soft); font-weight:700;}
  .empty p{margin:0; font-size:13.5px; max-width:34ch; line-height:1.7;}

  /* loading */
  .loading{
    height:480px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; text-align:center;
  }
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:3.5px solid var(--primary-tint);
    border-top-color:var(--primary);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading .ltxt{font-size:14.5px; color:var(--ink-soft); font-weight:600;}
  .loading .lsub{font-size:12.5px; color:var(--ink-faint); margin-top:-12px;}
  .lbar{width:200px;height:5px;border-radius:99px;background:var(--line-soft); overflow:hidden;}
  .lbar > i{display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-40%;}100%{margin-left:100%;}}

  /* SOAP blocks */
  .soap{display:flex; flex-direction:column; gap:14px;}
  .block{
    border:1px solid var(--line); border-radius:14px;
    padding:15px 17px 16px; background:#fff;
    opacity:0; transform:translateY(10px);
    transition:opacity .45s ease, transform .45s ease, border-color .3s;
  }
  .block.show{opacity:1; transform:none;}
  .block.active{border-color:var(--blk); box-shadow:0 0 0 3px var(--blk-tint);}
  .block-head{display:flex; align-items:center; gap:11px; margin-bottom:9px;}
  .badge{
    width:34px;height:34px;flex:0 0 auto; border-radius:10px;
    display:grid;place-items:center; color:#fff; font-weight:700; font-size:16px;
    font-family:"Outfit",sans-serif;
    background:var(--blk); box-shadow:0 5px 12px -5px var(--blk);
  }
  .block-head .labels{display:flex; flex-direction:column; line-height:1.25;}
  .block-head .en{font-family:"Outfit",sans-serif; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--blk-deep);}
  .block-head .jp{font-size:14px; font-weight:700; color:var(--ink);}
  .block-body{font-size:14.5px; line-height:1.85; color:var(--ink); white-space:pre-wrap;}
  .caret{display:inline-block; width:2px; height:1.05em; background:var(--blk); vertical-align:-2px; margin-left:1px; animation:blink .9s steps(1) infinite; border-radius:2px;}
  @keyframes blink{50%{opacity:0;}}

  .res-foot{
    display:flex; align-items:center; gap:8px;
    padding:13px 20px; border-top:1px solid var(--line-soft);
    color:var(--ink-faint); font-size:12px;
  }
  .res-foot svg{width:14px;height:14px;}
  .res-foot .ai-tag{
    margin-left:auto; font-family:"Outfit",sans-serif; font-weight:500; letter-spacing:.02em;
    color:var(--ink-faint);
  }

  /* action bar under results */
  .action-bar{
    display:flex; gap:11px; padding:14px 20px 18px;
  }
  .action-bar .btn-emr{flex:1.3;}
  .action-bar .btn-ghost{flex:1;}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:0 14px 34px -10px rgba(0,0,0,.4);
    display:flex; align-items:center; gap:9px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:90;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px; color:#7DE0C0;}

  @media (prefers-reduced-motion: reduce){
    .block{transition:opacity .2s;}
    .spinner{animation-duration:1.2s;}
    .caret{animation:none;}
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
